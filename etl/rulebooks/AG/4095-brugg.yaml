- id: nachverdichtungsgebiet
  source: bno_2024
  page: 7
  section: § 6 Abs. 2
  quote: Der Stadtrat kann in diesen Gebieten maximal drei Vollgeschosse, die geschlossene Bauweise und eine Ausnützungsziffer von 0.6 bewilligen.
  note: Overlay im Bauzonenplan; als Flag geführt, nicht modelliert.
- id: hochhausstandort
  source: bno_2024
  page: 8
  section: § 7 Abs. 2
  quote: In den im Bauzonenplan speziell bezeichneten Gebieten sind Hochhäuser auf der Grundlage eines rechtskräftigen Gestaltungsplans zulässig.
  note: Flag only.
