definitions:
  az_counts_attika_dg:
    value: false
    source: bno_2024
    page: 32
    section: § 74
    quote: Dach-, Attika- und Untergeschosse werden bei der Ausnützungsziffer nicht angerechnet.
    verified: false
  geschlossene_bauweise_zulaessig:
    value: true
    source: bno_2024
    page: 11
    section: § 13 Abs. 5
    quote: Wo die BNO nichts anderes bestimmt, sind sowohl die offene wie auch die geschlossene Bauweise zulässig.
    verified: false
    note: Engine setzt an Grenzen mit beidseitig angebauten Gebäuden (Brandmauer) keinen Grenzabstand an.
  az_bonus_scope:
    value: WA zones
    source: bno_2024
    page: 11
    section: § 13 Abs. 4
    quote: Der Stadtrat kann in den Wohn- und Arbeitszonen für publikumsorientierte Nutzungen im Erdgeschoss einen Ausnützungsbonus von 0.1 zulassen.
    verified: false
