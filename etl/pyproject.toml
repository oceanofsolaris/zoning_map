[project]
name = "pp-etl"
version = "0.1.0"
description = "Parcel Potential: ETL, rulebooks and capacity engine"
authors = [{ name = "Stephan Burkhardt" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pypdf>=5",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=16",
    "rasterio>=1.4",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]

[project.scripts]
pp = "pp_etl.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
